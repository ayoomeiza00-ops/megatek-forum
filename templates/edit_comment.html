{% extends "base.html" %}
{% block content %}
<h1>Edit Comment</h1>
<form method="POST">
    <textarea name="content" rows="6" style="width:100%;padding:12px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-secondary);color:var(--text-primary);font-family:inherit;font-size:14px;">{{ comment.content }}</textarea>
    <div style="margin-top:12px;"><button type="submit" style="background:#2563eb;color:#fff;padding:10px 30px;border:none;border-radius:8px;cursor:pointer;font-size:16px;">Update Comment</button> <a href="{{ url_for('view_post', post_id=comment.post_id) }}" style="color:var(--text-secondary);margin-left:12px;text-decoration:none;">Cancel</a></div>
</form>
{% endblock %}
