{% extends "base.html" %}
{% block content %}
<h1>Message from {{ message.sender.username }}</h1>
<div style="background:var(--hover-bg);padding:20px;border-radius:8px;margin:16px 0;"><p style="color:var(--text-muted);font-size:13px;">Sent on {{ message.timestamp.strftime('%B %d, %Y at %H:%M') }}</p><p style="font-size:16px;line-height:1.8;white-space:pre-wrap;">{{ message.content }}</p></div>
<p><a href="{{ url_for('messages') }}">← Back to Messages</a></p>
{% endblock %}
